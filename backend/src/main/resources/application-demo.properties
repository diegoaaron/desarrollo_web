# Perfil de demostración (SPRING_PROFILES_ACTIVE=demo, o dev,demo en local).
# Carga una sola vez el catálogo, los clientes y los pedidos de demo (ver DemoDataInitializer).
# Todos los datos son ficticios.

# Administrador demo. Sin DEMO_ADMIN_PASSWORD se genera una contraseña aleatoria y se muestra en el log.
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@demo.coralshop.pe}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}

# Contraseña común de los cinco clientes demo (cuentas ficticias, sin datos reales).
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:Cliente2026}
