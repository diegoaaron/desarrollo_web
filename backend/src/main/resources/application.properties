spring.application.name=coral-shop-backend
server.port=8082

# Variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway aplica migraciones; JPA comprueba las tablas sin crearlas ni modificarlas.
spring.jpa.hibernate.ddl-auto=validate

# Mensajes de validación siempre en español, sin depender del navegador.
spring.web.locale=es
spring.web.locale-resolver=fixed

# Diseños del cliente: PNG/JPG de hasta 5 MB (D7). La solicitud admite un margen para el resto del formulario.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Si el archivo excede el límite, Tomcat lee el resto para poder responder el error en JSON.
server.tomcat.max-swallow-size=10MB
